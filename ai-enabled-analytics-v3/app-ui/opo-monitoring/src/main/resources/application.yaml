server:
  port: ${SERVER_PORT:8080}

downstream:
  runtime-service:
    base-url: ${RUNTIME_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout: 5s
    read-timeout: 60s
  analytics-foundation:
    base-url: ${ANALYTICS_FOUNDATION_BASE_URL:http://localhost:8200}
    connect-timeout: 5s
    read-timeout: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info
