apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-workflow-runtime
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: analytics-workflow-runtime
    app.kubernetes.io/component: agent-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-workflow-runtime
  template:
    metadata:
      labels:
        app: analytics-workflow-runtime
        app.kubernetes.io/name: analytics-workflow-runtime
        app.kubernetes.io/component: agent-runtime
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workflow-runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OPO_MONITORING_SERVICE_CHECKPOINT_DB
              value: /tmp/checkpoints.sqlite
            - name: ASML_AI_SESSION_DB
              value: /tmp/agent-sessions.sqlite
            - name: ASML_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: analytics-workflow-runtime-secrets
                  key: api-key
                  optional: true
            - name: SSL_CERT_FILE
              value: /etc/ssl/asml/combined-ca-bundle.pem
          volumeMounts:
            - name: asml-ca-bundle
              mountPath: /etc/ssl/asml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        # Provisioned separately (out-of-band), same as the postgres/api-key secrets:
        # a ConfigMap named asml-ca-bundle with key combined-ca-bundle.pem, containing
        # this cluster's ASML internal CA chain concatenated onto the base image's
        # certifi bundle. Required because platform.ai.asml.com's certificate is
        # issued by ASML's internal PKI, which python:3.12-slim does not trust.
        - name: asml-ca-bundle
          configMap:
            name: asml-ca-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-workflow-runtime
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: analytics-workflow-runtime
spec:
  selector:
    app: analytics-workflow-runtime
  ports:
    - name: http
      port: 8000
      targetPort: http
