services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-enabled-analytics-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_enabled_analytics_v2
    ports:
      - "5432:5432"
    volumes:
      - ai_enabled_analytics_v2_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  ai_enabled_analytics_v2_pgdata:
