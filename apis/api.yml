openapi: 3.1.0
info:
  description: API specification for the analytics-facade service.
  title: Analytics Facade REST API
  version: '0.0.1-SNAPSHOT'
servers:
- description: local development server
  url: http://localhost:8080/analytics-facade
- description: VCP-DC/OS server
  url: "http://{deployment_sub_config}wrfoundationuianalyticsfacadeservice.marathon.l4lb.thisdcos.directory:8080/analytics-facade"
  variables:
    deployment_sub_config:
      default: prod
      enum:
      - prod
tags:
- description: "user session expose creation, validation and termination of a user-session."
  name: user-session
- description: Custom API endpoint to allow LINDA application.
  name: linda
- description: Custom API endpoint to allow LINDA application to interface with platform
    related services for data from workspace
  name: linda-data
- description: "Workspace [v2] basic API operations."
  name: "workspace [v2]"
- description: Workspace blob basic API operations.
  name: "workspace [v2] blob"
- description: Database basic API operations
  name: database
- description: Custom API endpoint to allow LINDA application to interface with platform
    related services for contexts for given workspace
  name: linda-context
- description: Processing Instance basic API operations
  name: processing
- description: workspace api that requires an user session and can create and delete
    a workspace.
  name: workspace
- description: Notification API operations
  name: notifications
- description: Asset management API operations
  name: asset
- description: Custom API endpoint to allow LINDA application to interface with platform
    related services related to 'ovl-tdbb'
  name: linda-tdbb
paths:
  /linda/v1/context/{workspaceId}:
    get:
      description: Returns context data response. The response contains a hardcoded
        list for context-types the values depend on the data available in workspace.
      operationId: getLindaContextData
      parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              examples:
                output:
                  $ref: "#/components/examples/getLindaContextResponse"
              schema:
                $ref: "#/components/schemas/ContextResponse"
          description: Successfully returns the context-types and their values for
            the given workspace
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "422":
          content:
            application/json:
              example:
                title: Error while fetching context data
                errorID: ANALYTICS_FACADE.LINDA.CONTEXT_DATA_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: All context selections were removed due to userInput invalidation
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      security:
      - bearerHttpAuthentication: []
      tags:
      - linda-context
      - linda
  /linda/v1/data/{workspaceId}/{flowInstanceId}:
    get:
      description: Retrieve dataset result for given workspaceId and only the rows
        that match the flowInstanceId.The response body will contain the resulting
        data in tabular format.The response also contains the list of columns and
        the data is in the same order as the list of columns.The response contains
        all the columns produced by the flow.
      operationId: getLindaData
      parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: flowInstanceId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              examples:
                output:
                  $ref: "#/components/examples/getLindaDataResponse"
              schema:
                $ref: "#/components/schemas/DataResponse"
          description: Successfully returns the dataset
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "404":
          content:
            application/problem+json:
              example:
                title: DataRecordCollectionId not found for WorkspaceId:453927b7-6e24-4755-a678-df30dacae240
                errorID: ANALYTICS_FACADE.LINDA.GET_DATA_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Failed to find DataRecordCollectionId in workspace. Or failed
            to find DataRecordCollection in  inventory. Or failed to find TableReference
            for the flow.
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      security:
      - bearerHttpAuthentication: []
      tags:
      - linda-data
      - linda
  /linda/v1/tdbb/execute/{workspaceId}:
    post:
      description: Execute an ovl-tdbb flow for a given workspace with specified settings
        asynchronously.
      operationId: executeLindaTdbbFlow
      parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            examples:
              input:
                $ref: "#/components/examples/postLindaFlowRequest"
            schema:
              $ref: "#/components/schemas/FlowExecutionRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              examples:
                output:
                  $ref: "#/components/examples/postLindaFlowResponse"
              schema:
                $ref: "#/components/schemas/FlowStatusResponse"
          description: Successfully started execution of an ovl-tddb flow
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      security:
      - bearerHttpAuthentication: []
      tags:
      - linda-tdbb
      - linda
  /linda/v1/tdbb/status/{workspaceId}/{flowInstanceId}:
    get:
      description: Returns status of flow based on workspaceId and the specific flowInstanceId.
      operationId: getLindaTdbbFlowStatus
      parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: flowInstanceId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              examples:
                output:
                  $ref: "#/components/examples/getLindaFlowStatusResponse"
              schema:
                $ref: "#/components/schemas/FlowStatusResponse"
          description: Successfully returns the status of the flow.
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowStatusResponse"
          description: Failed to find flow and/or workspace
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      security:
      - bearerHttpAuthentication: []
      tags:
      - linda-tdbb
      - linda
  /v1/asset:
    get:
      description: Retrieve all accessible asset references for the authenticated
        user
      operationId: getAllAccessibleAssets
      parameters:
      - description: Filter by asset type (exact match)
        in: query
        name: type
        required: false
        schema:
          type: string
      - description: Filter by asset name (case-insensitive partial match)
        in: query
        name: name
        required: false
        schema:
          type: string
      - description: Filter by sharing type
        in: query
        name: sharing
        required: false
        schema:
          type: string
          description: The sharing options for an asset.
          enum:
          - private
          - public
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetReference"
          description: Successfully retrieved all accessible assets
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      security:
      - bearerHttpAuthentication: []
      tags:
      - asset
    post:
      description: Upload a new asset with metadata
      operationId: addAsset
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                asset:
                  type: string
                  format: binary
                request:
                  $ref: "#/components/schemas/AssetReferenceRequest"
              required:
              - asset
              - request
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetReference"
          description: Successfully uploaded the asset
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "404":
          content:
            application/problem+json:
              example:
                title: No workspace found for WorkspaceId:8ea7f282-9b3a-4edc-b9ea-e722c730771a
                errorID: ANALYTICS_FACADE.WORKSPACE.GET_WORKSPACE_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Workspace not found
        "413":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AssetReference"
          description: Asset file size exceeds the maximum allowed limit (10Mb)
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      security:
      - bearerHttpAuthentication: []
      tags:
      - asset
  /v1/asset/{id}:
    delete:
      description: Delete an asset from GridFS by its asset reference ID
      operationId: deleteAsset
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Successfully deleted the asset
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "404":
          description: Asset not found or user not authorized
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      security:
      - bearerHttpAuthentication: []
      tags:
      - asset
    put:
      description: Update an asset reference metadata by its ID
      operationId: updateAsset
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetReferenceUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetReference"
          description: Successfully updated the asset reference
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetReference"
          description: Asset not found or user not authorized
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      security:
      - bearerHttpAuthentication: []
      tags:
      - asset
  /v1/asset/{id}/download:
    get:
      description: Download an asset from GridFS by its asset reference ID
      operationId: getAsset
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/octet-stream: {}
          description: Successfully retrieved the asset
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "404":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: Asset not found
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      security:
      - bearerHttpAuthentication: []
      tags:
      - asset
  /v1/notifications:
    get:
      description: Retrieve notifications
      operationId: getNotifications
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationResponse"
          description: Successfully retrieved list of notifications
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      security:
      - bearerHttpAuthentication: []
      tags:
      - notifications
    post:
      description: Create a new notification
      operationId: createNotification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
          description: Successfully created the notification
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      tags:
      - notifications
  /v1/notifications/long-poll:
    get:
      description: Retrieve new notifications using long-polling
      operationId: longPollNotifications
      parameters:
      - description: Optional parameter to let endpoint respond with existing notifications
          created after the given timestamp.
        in: query
        name: since
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationResponse"
          description: Successfully retrieved list of notifications
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      security:
      - bearerHttpAuthentication: []
      tags:
      - notifications
  /v1/notifications/read:
    put:
      description: Mark notifications as read
      operationId: readNotifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadRequest"
        required: true
      responses:
        "204":
          description: Notifications marked as read
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      security:
      - bearerHttpAuthentication: []
      tags:
      - notifications
  /v1/user/session:
    delete:
      description: Terminates a session of authenticated user based on their token.
      operationId: terminateUserSession
      responses:
        "204":
          description: Successfully terminated the session of the user
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      security:
      - bearerHttpAuthentication: []
      tags:
      - user-session
    get:
      description: Validates if the given token is still valid for the session for
        user.
      operationId: validateUserSession
      responses:
        "204":
          description: Successfully validated the token
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: "Unauthorized request: authentication token is missing"
        "500":
          content:
            application/problem+json:
              example:
                title: Internal server error
                errorID: ANALYTICS_FACADE.REQUEST.INTERNAL_SERVER_ERROR
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Internal Server Error
      security:
      - bearerHttpAuthentication: []
      tags:
      - user-session
    post:
      description: Creates a user session based on credentials.
      operationId: createUserSession
      requestBody:
        content:
          application/json:
            examples:
              input:
                $ref: "#/components/examples/postSessionRequest"
            schema:
              $ref: "#/components/schemas/UserAuthenticationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              examples:
                output:
                  $ref: "#/components/examples/postSessionResponse"
              schema:
                $ref: "#/components/schemas/UserAuthenticationResponse"
          description: Successfully created a session for the user
        "400":
          content:
            application/problem+json:
              example:
                title: Required request parameter is not present
                errorID: ANALYTICS_FACADE.REQUEST.VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
          description: Input validation failed
        "401":
          content:
            application/problem+json:
              example:
                title: Unauthorized
                errorID: ANALYTICS_FACADE.REQUEST.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ProblemMessage"
