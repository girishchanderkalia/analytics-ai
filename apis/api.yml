          $ref: "#/components/schemas/DataIngestionErrors"
          description: Ingestion errors grouped by job type
        ingestionPercentage:
          type: integer
          format: int32
          description: "Ingestion progress as a percentage (0-100). Calculated as\
            \ ((initialProxyCount - currentProxy) / initialProxyCount) * 100, where\
            \ initialProxyCount is the number of proxy partitions at the time ingestion\
            \ was triggered. Null when initialProxyCount is unavailable (e.g. ingestion\
            \ has not been triggered yet)."
        ingestionTriggeredAt:
          type: string
          format: date-time
          description: The timestamp at which data ingestion was triggered. Used to
            display elapsed time. Null when ingestion has not been triggered yet.
